<style>
  :root {
    /* Keebra Park GRLA colours, sampled from the academy logo */
    --kp-pink: #F257A0;      /* logo pink */
    --kp-cyan: #11B1DE;      /* logo cyan */
    --pink-dk: #B12F6E;      /* deeper logo pink, readable with white text */
    --cyan-dk: #0A6A8A;      /* deeper logo cyan, readable with white text */
    --kp-deep: #0B4F6A;      /* deepest cyan, for selected states */

    --bg: #f3f1f4;
    --card: #ffffff;
    --ink: #16121c;
    --ink-2: #4a4352;
    --line: #d6cfd9;
    --accent-soft: #fdedf5;
    --good: #12733a;
    --good-soft: #e2f4e8;
    --warn: #9a3412;
    --warn-soft: #fff1e6;
    --bad: #b42318;
    --bad-soft: #fdecea;
    --today-soft: #e5f7fd;
    --radius: 14px;
    --tap: 48px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--kp-cyan); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Header */
  header.top { background: #fff; color: var(--ink); padding: 10px 16px 0; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 6px rgba(11, 79, 106, .08); }
  header.top::after { content: ""; display: block; height: 5px; margin: 0 -16px; background: linear-gradient(90deg, var(--kp-pink) 0 50%, var(--kp-cyan) 50% 100%); }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; max-width: 1200px; margin: 0 auto; }
  .brand-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-wrap img { width: 64px; height: auto; flex: 0 0 auto; display: block; }
  .brand { font-weight: 900; font-size: 19px; line-height: 1.15; letter-spacing: -.01em; color: var(--cyan-dk); min-width: 0; }
  .brand small { display: block; font-weight: 800; font-size: 11px; color: var(--pink-dk); letter-spacing: .12em; text-transform: uppercase; margin-top: 3px; }
  .brand-text { min-width: 0; }
  .save-status { font-size: 13px; font-weight: 700; color: var(--good); min-height: 1em; margin-top: 3px; }
  @media (max-width: 699px) { header.top { position: static; } }
  .save-status.off { color: var(--warn); }
  nav.tabs { display: flex; gap: 6px; max-width: 1200px; margin: 10px auto 0; }
  nav.tabs button {
    flex: 1; min-height: var(--tap); border: 0; border-radius: 12px 12px 0 0;
    background: transparent; color: var(--ink-2); font-weight: 800; font-size: 16px;
  }
  nav.tabs button[aria-selected="true"] { background: var(--bg); color: var(--pink-dk); box-shadow: inset 0 3px 0 var(--kp-pink); }

  main { max-width: 1200px; margin: 0 auto; padding: 14px 16px 90px; }
  .banner { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; font-weight: 600; }
  .banner.warn { background: var(--warn-soft); color: var(--warn); border: 2px solid #f3b989; }

  /* Week selector */
  .week-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin: 2px 0 8px; }
  .week-head h1 { font-size: 24px; margin: 0; color: var(--kp-deep); }
  .week-head .week-note { color: var(--ink-2); font-size: 15px; font-weight: 600; }
  .weeks { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 14px; }
  .weeks button {
    min-height: var(--tap); border: 2px solid var(--line); background: var(--card); border-radius: 12px;
    font-weight: 800; font-size: 18px; padding: 0;
  }
  .weeks button span { display: block; font-size: 11px; font-weight: 700; color: var(--ink-2); line-height: 1; }
  .weeks button[aria-pressed="true"] { background: var(--pink-dk); border-color: var(--pink-dk); color: #fff; }
  .weeks button[aria-pressed="true"] span { color: #ffd9ea; }

  /* Panels on My week */
  .panel-card { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
  .panel-card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 6px; color: var(--pink-dk); }
  .panel-card.need { border-color: var(--kp-pink); box-shadow: 0 0 0 3px #fbd3e6; }
  .target-big { font-size: 24px; font-weight: 900; line-height: 1.2; }
  .target-sub { color: var(--ink-2); font-size: 15px; margin-top: 2px; }
  .lane-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .lane-row .lbl { font-size: 15px; font-weight: 600; color: var(--ink-2); width: 100%; }
  .chip {
    min-height: var(--tap); min-width: var(--tap); padding: 0 14px; border-radius: 999px;
    border: 2px solid var(--line); background: #fff; font-weight: 800;
  }
  .chip[aria-pressed="true"] { background: var(--kp-deep); border-color: var(--kp-deep); color: #fff; }
  .chip small { font-weight: 600; font-size: 13px; }
  .prog-grid { display: grid; gap: 10px; }
  @media (min-width: 560px) { .prog-grid { grid-template-columns: 1fr 1fr; } }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .seg button { min-height: var(--tap); border: 2px solid var(--line); border-radius: 12px; background: #fff; font-weight: 800; font-size: 15px; padding: 4px 8px; }
  .seg button[aria-pressed="true"] { background: var(--kp-deep); border-color: var(--kp-deep); color: #fff; }

  /* Today strip */
  .today-strip { background: var(--today-soft); border: 2px solid var(--kp-cyan); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; }
  .today-strip h2 { margin: 0 0 6px; font-size: 18px; color: var(--cyan-dk); }
  .today-strip ul { margin: 0; padding: 0; list-style: none; }
  .today-strip li button { all: unset; cursor: pointer; display: block; padding: 6px 0; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .today-strip li button:focus-visible { outline: 3px solid var(--pink-dk); }

  /* Day cards */
  .days { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 760px) { .days { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1100px) { .days { grid-template-columns: repeat(3, 1fr); } }
  .day { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 12px; min-width: 0; }
  .day.is-today { border-color: var(--kp-cyan); box-shadow: 0 0 0 3px #bfeaf8; }
  .day-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .day-head h3 { margin: 0; font-size: 20px; }
  .badge { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--kp-cyan); color: #06222e; text-transform: uppercase; letter-spacing: .04em; }
  .day-count { font-size: 14px; color: var(--ink-2); font-weight: 600; }
  .empty-day { color: var(--ink-2); font-size: 15px; margin: 2px 0 10px; }
  .sessions { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 8px; }
  .sess { display: flex; align-items: stretch; gap: 8px; border: 2px solid var(--line); border-radius: 12px; background: #fcfbfd; min-width: 0; }
  .sess.done { background: var(--good-soft); border-color: #9fd3b1; }
  .tick {
    flex: 0 0 auto; width: 52px; border: 0; border-right: 2px solid var(--line); background: transparent;
    border-radius: 10px 0 0 10px; display: grid; place-items: center;
  }
  .tick .box { width: 30px; height: 30px; border: 3px solid var(--ink-2); border-radius: 8px; display: grid; place-items: center; background: #fff; }
  .sess.done .tick { border-right-color: #9fd3b1; }
  .sess.done .tick .box { background: var(--good); border-color: var(--good); }
  .tick svg { width: 20px; height: 20px; visibility: hidden; }
  .sess.done .tick svg { visibility: visible; }
  .open { flex: 1; min-width: 0; text-align: left; background: transparent; border: 0; padding: 10px 10px 10px 2px; }
  .open .t { display: block; font-weight: 800; font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
  .sess.done .open .t { text-decoration: line-through; text-decoration-thickness: 2px; }
  .open .m { display: block; font-size: 15px; color: var(--ink-2); margin-top: 3px; overflow-wrap: anywhere; }
  .open .m strong { color: var(--ink); }
  .open .warnline { color: var(--pink-dk); font-weight: 800; }
  .tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; margin-bottom: 4px; color: #fff; }
  .tag.broncos { background: var(--kp-deep); } .tag.mas { background: var(--cyan-dk); }
  .tag.gymprog { background: var(--pink-dk); } .tag.zone2 { background: #1d6b3a; }
  .tag.gym { background: #5b2a86; } .tag.skills { background: #0f6e5b; } .tag.speed { background: #8a1c5c; }
  .tag.team { background: #1f2f4d; } .tag.recovery { background: #3d6b12; } .tag.custom { background: #4a5468; }
  .add-btn {
    width: 100%; min-height: var(--tap); border: 2px dashed #a796ad; border-radius: 12px; background: #fff;
    font-weight: 800; color: var(--pink-dk);
  }

  /* Buttons */
  .btn { min-height: var(--tap); padding: 0 16px; border-radius: 12px; border: 2px solid var(--line); background: #fff; font-weight: 800; }
  .btn.primary { background: var(--pink-dk); border-color: var(--pink-dk); color: #fff; }
  .btn.good { background: var(--good); border-color: var(--good); color: #fff; }
  .btn.danger { color: var(--bad); border-color: #f0a29b; }
  .btn[aria-pressed="true"] { background: var(--kp-deep); border-color: var(--kp-deep); color: #fff; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn-row .btn { flex: 1 1 140px; }
  .linkish { background: none; border: 0; padding: 0; color: var(--cyan-dk); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; min-height: 0; }

  /* Calculator */
  .panel { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .panel h1 { font-size: 24px; margin: 0 0 6px; color: var(--kp-deep); }
  .panel h2 { font-size: 19px; margin: 0 0 8px; }
  .panel p { margin: 0 0 10px; }
  fieldset { border: 0; padding: 0; margin: 0 0 14px; min-width: 0; }
  legend { font-weight: 800; font-size: 18px; margin-bottom: 8px; padding: 0; }
  .time-fields { display: flex; gap: 10px; }
  .time-fields label { flex: 1; font-weight: 700; font-size: 15px; color: var(--ink-2); }
  .time-fields input { display: block; width: 100%; margin-top: 4px; }
  input[type="text"], input[type="number"], input[type="time"], select, textarea {
    min-height: var(--tap); width: 100%; border: 2px solid #9a8ca0; border-radius: 10px; padding: 8px 12px; background: #fff; font-size: 18px;
  }
  .time-fields input { font-size: 26px; font-weight: 800; text-align: center; }
  input[aria-invalid="true"] { border-color: var(--bad); background: var(--bad-soft); }
  textarea { min-height: 96px; resize: vertical; }
  .radio-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .radio-row label { display: flex; align-items: center; gap: 10px; min-height: var(--tap); border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; font-weight: 700; }
  .radio-row input { width: 22px; height: 22px; accent-color: var(--pink-dk); flex: 0 0 auto; }
  .radio-row label:has(input:checked) { border-color: var(--pink-dk); background: var(--accent-soft); }
  .hint { font-size: 15px; color: var(--ink-2); margin-top: 6px; }
  .error { background: var(--bad-soft); color: var(--bad); border: 2px solid #f0a29b; border-radius: 12px; padding: 10px 12px; font-weight: 700; margin-top: 10px; }
  .result { border: 3px solid var(--pink-dk); border-radius: var(--radius); padding: 14px; background: var(--accent-soft); margin-top: 12px; }
  .result .headline { font-size: 28px; font-weight: 900; line-height: 1.15; }
  .result dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 10px 0 0; font-size: 16px; }
  .result dt { color: var(--ink-2); font-weight: 600; }
  .result dd { margin: 0; font-weight: 800; }
  .placeholder { border: 2px dashed var(--line); border-radius: var(--radius); padding: 14px; color: var(--ink-2); margin-top: 12px; }
  details { margin-top: 8px; }
  summary { cursor: pointer; font-weight: 700; min-height: 40px; display: flex; align-items: center; }
  .formula { font-size: 15px; color: var(--ink-2); }
  .formula ol { padding-left: 20px; margin: 6px 0 0; }

  /* Sheet (dialog) */
  dialog.sheet {
    border: 0; padding: 0; width: min(640px, 100%); max-width: 100%; max-height: 92vh;
    border-radius: 18px 18px 0 0; margin: auto auto 0; background: var(--card); color: var(--ink);
  }
  @media (min-width: 700px) { dialog.sheet { border-radius: 18px; margin: auto; } }
  dialog.sheet::backdrop { background: rgba(6, 34, 46, .55); }
  .sheet-head { position: sticky; top: 0; background: var(--card); display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 14px 16px 10px; border-bottom: 4px solid var(--kp-pink); z-index: 1; }
  .sheet-head h2 { margin: 0; font-size: 21px; line-height: 1.25; overflow-wrap: anywhere; color: var(--kp-deep); }
  .sheet-head .sub { font-size: 15px; color: var(--ink-2); font-weight: 600; }
  .close-x { flex: 0 0 auto; width: var(--tap); height: var(--tap); border-radius: 12px; border: 2px solid var(--line); background: #fff; font-size: 26px; line-height: 1; font-weight: 700; }
  .sheet-body { padding: 14px 16px 24px; }
  .sheet-body section { margin-bottom: 16px; }
  .sheet-body h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .07em; color: var(--pink-dk); margin: 0 0 6px; }
  .sheet-body p, .sheet-body ul, .sheet-body ol { margin: 0 0 8px; }
  .sheet-body ul, .sheet-body ol { padding-left: 22px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fact { background: var(--bg); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .fact b { display: block; font-size: 19px; line-height: 1.2; overflow-wrap: anywhere; }
  .fact span { font-size: 12px; font-weight: 800; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
  .fact.wide { grid-column: 1 / -1; }
  .seq { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0 !important; }
  .seq li { padding: 6px 10px; border-radius: 8px; font-weight: 800; font-size: 15px; }
  .seq .run { background: var(--kp-deep); color: #fff; }
  .seq .rest { background: var(--bg); border: 2px solid var(--line); }
  .seq .rest.long { background: var(--today-soft); border-color: var(--kp-cyan); }
  .ex-list { list-style: none; padding: 0 !important; margin: 0; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
  .ex-list li { padding: 10px 12px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 30px 1fr auto; gap: 2px 10px; align-items: baseline; }
  .ex-list li:first-child { border-top: 0; }
  .ex-list .slot { font-weight: 900; color: var(--pink-dk); }
  .ex-list .nm { font-weight: 800; min-width: 0; overflow-wrap: anywhere; }
  .ex-list .dose { font-weight: 900; text-align: right; max-width: 9.5em; }
  .ex-list .sub2 { grid-column: 2 / -1; font-size: 14px; color: var(--ink-2); }
  .ex-list .cue { grid-column: 2 / -1; font-size: 14px; color: var(--good); font-weight: 600; }
  .ex-list .vid { grid-column: 2 / -1; justify-self: start; display: inline-flex; align-items: center; min-height: 40px; font-size: 15px; font-weight: 800; color: var(--cyan-dk); text-decoration: underline; text-underline-offset: 3px; }
  .fold > summary { list-style: none; min-height: var(--tap); cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary::after { content: "▾"; font-size: 20px; color: var(--pink-dk); transition: transform .15s; }
  .fold[open] > summary::after { transform: rotate(180deg); }
  .fold .kicker { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--pink-dk); }
  .fold .sum-line { display: block; font-weight: 800; font-size: 16px; margin-top: 2px; }
  .skill-chips { display: grid; gap: 6px; }
  .skill-chip { text-align: left; min-height: var(--tap); border: 2px solid var(--line); border-radius: 12px; background: #fff; padding: 8px 12px 8px 40px; position: relative; }
  .skill-chip::before { content: ""; position: absolute; left: 12px; top: 12px; width: 18px; height: 18px; border: 3px solid var(--ink-2); border-radius: 5px; background: #fff; }
  .skill-chip[aria-pressed="true"] { border-color: var(--cyan-dk); background: var(--today-soft); }
  .skill-chip[aria-pressed="true"]::before { background: var(--cyan-dk); border-color: var(--cyan-dk); box-shadow: inset 0 0 0 3px #fff; }
  .skill-chip b { display: block; font-size: 16px; }
  .skill-chip span { display: block; font-size: 14px; color: var(--ink-2); font-weight: 500; }
  .group-h { font-weight: 800; margin: 12px 0 6px; font-size: 16px; }
  .group-h small { font-weight: 600; color: var(--ink-2); font-size: 14px; }
  .callout { border-left: 5px solid var(--kp-cyan); background: var(--today-soft); padding: 10px 12px; border-radius: 0 12px 12px 0; font-size: 15px; }
  .callout.pink { border-left-color: var(--kp-pink); background: var(--accent-soft); }
  .field { margin-bottom: 14px; }
  .field > label, .field > .lbl { display: block; font-weight: 800; margin-bottom: 6px; }
  .field .opt { font-weight: 600; color: var(--ink-2); font-size: 14px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .type-grid button { min-height: var(--tap); border: 2px solid var(--line); border-radius: 10px; background: #fff; font-weight: 700; font-size: 15px; padding: 4px; }
  .type-grid button[aria-pressed="true"] { background: var(--kp-deep); border-color: var(--kp-deep); color: #fff; }
  .check-row { display: flex; gap: 12px; align-items: flex-start; border: 2px solid var(--line); border-radius: 12px; padding: 12px; }
  .check-row input { width: 26px; height: 26px; flex: 0 0 auto; accent-color: var(--pink-dk); margin: 0; }
  .check-row b { display: block; }
  .check-row span { font-size: 15px; color: var(--ink-2); }
  .notes-box { white-space: pre-wrap; background: var(--bg); border-radius: 12px; padding: 10px 12px; overflow-wrap: anywhere; }

  .toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(150%);
    background: var(--kp-deep); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 700;
    max-width: calc(100% - 32px); transition: transform .2s ease, opacity .2s ease, visibility .2s; z-index: 50; text-align: center;
    opacity: 0; visibility: hidden; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; visibility: visible; }
  footer.foot { text-align: center; font-size: 13px; color: var(--ink-2); padding: 10px 16px 30px; }
  /* ---------- Phone layout ---------- */
  button, summary, select, a { touch-action: manipulation; -webkit-tap-highlight-color: rgba(17, 177, 222, .18); }
  .linkish { display: inline-flex; align-items: center; min-height: 44px; }
  main { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  dialog.sheet { max-height: 92vh; max-height: 92dvh; }
  .sheet-body { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  .fold { padding-top: 6px; padding-bottom: 6px; }
  .fold[open] { padding-bottom: 14px; }
  @media (max-width: 699px) {
    nav.tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin: 0; gap: 6px;
      background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -4px 14px rgba(11, 79, 106, .10);
      padding: 6px max(8px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    }
    nav.tabs button { border-radius: 12px; min-height: 52px; }
    nav.tabs button[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--kp-pink); }
    main { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    footer.foot { padding-bottom: calc(90px + env(safe-area-inset-bottom)); }
    .toast { bottom: calc(84px + env(safe-area-inset-bottom)); }
    header.top { padding-bottom: 10px; }
    .weeks { gap: 4px; }
    .week-head h1 { font-size: 22px; }
    .fold { margin-bottom: 8px; }
    .fold + .fold { margin-top: 0; }
    .days { margin-top: 14px; }
  }
  .tab-short { display: none; }
  @media (max-width: 400px) { .tab-long { display: none; } .tab-short { display: inline; } }
  @media (max-width: 380px) {
    body { font-size: 16px; }
    .type-grid { grid-template-columns: repeat(2, 1fr); }
    .radio-row { grid-template-columns: 1fr; }
  }
</style>
</head>

<script>
/* =====================================================================
   COACH CONFIGURATION — change these before sending the file to players
   ---------------------------------------------------------------------
   Everything a coach is likely to adjust lives in this block: weekly
   doses, default weekdays, squad lanes, rest and recovery timings,
   Bronco turn adjustments, the Zone 2 run, and the gym programs.
   ===================================================================== */
const CONFIG = {
  // Shown in the header.
  programName: "Holiday Program Builder",
  programSubtitle: "Keebra Park GRLA · 6 weeks",

  // Where each player's data is saved on their own device. Change this text
  // (e.g. "...-2027") when you send out a NEW program so players start fresh.
  storageKey: "kp-grla-offseason-v1",

  // Optional: the Monday that Week 1 starts, as "YYYY-MM-DD" (e.g. "2026-12-01").
  // Leave as "" if players start whenever they like. When set, "Today" only shows
  // in the matching week and a "Go to this week" button appears.
  programStartMonday: "",

  // Default weekdays for the preloaded sessions (Mon, Tue, Wed, Thu, Fri, Sat, Sun).
  // Rule used: no gym the day before a conditioning session.
  defaultDays: { broncos: "Tue", mas: "Fri", gym1: "Wed", gym2: "Sat", zone2: "Sun" },

  // Weekly doses. One row per week.
  //   broncos: sets × reps of Broken Broncos
  //   mas:     sets × runs of Straight-line MAS
  //   zone2:   minutes of easy running (0 = no Zone 2 session that week)
  //   effort:  how hard the gym sets should feel that week
  //   note:    optional short line shown at the top of that week
  weeks: [
    { week: 1, broncos: { sets: 2, reps: 2 }, mas: { sets: 2, runs: 6 }, zone2: 20, effort: "Learn it: body weight, or the lightest load that holds the tempo", note: "Build in" },
    { week: 2, broncos: { sets: 1, reps: 3 }, mas: { sets: 2, runs: 7 }, zone2: 20, effort: "“I could have done 4 or 5 more reps”", note: "" },
    { week: 3, broncos: { sets: 1, reps: 4 }, mas: { sets: 2, runs: 8 }, zone2: 25, effort: "“I could have done 2 or 3 more reps”", note: "" },
    { week: 4, broncos: { sets: 1, reps: 5 }, mas: { sets: 2, runs: 8 }, zone2: 25, effort: "“I could have done 1 or 2 more reps”", note: "Peak week" },
    // Weeks 5–6: coach-editable extension — repeat Week 4, then ease back before team training.
    { week: 5, broncos: { sets: 1, reps: 5 }, mas: { sets: 2, runs: 8 }, zone2: 30, effort: "“I could have done 1 or 2 more reps”", note: "Repeat Week 4 workload" },
    { week: 6, broncos: { sets: 1, reps: 3 }, mas: { sets: 2, runs: 6 }, zone2: 20, effort: "“I could have done 2 or 3 more reps”, ease off", note: "Ease back before team training" }

  calculator: {

    return `
      <details class="panel-card fold fold-${id}${extraClass ? " " + extraClass : ""}${openByDefault ? " need" : ""}" data-fold="${id}" ${open ? "open" : ""}>

  }

  function skillsPanelHTML() {
    const g = skillGroup(), picked = workOnSkills();
    const summary = g ? (picked.length ? esc(picked.map(k => k.name).join(" · ")) : "Tick the skills from your feedback report") : "Choose your position";
    return foldHTML("skills", "My skills to work on", summary, `
        <div class="field" style="margin:10px 0 0">
          <label for="groupSel">My position</label>
          <select id="groupSel">

            ${CONFIG.skillGroups.map(x => `<option value="${x.id}" ${x.id === state.profile.skillGroup ? "selected" : ""}>${esc(x.name)}</option>`).join("")}
          </select>
        </div>
        ${g ? `<p class="hint">Tap the skills your coach marked to work on in your feedback report.</p>
          ${["Defence", "Attack"].map(area => `<div class="group-h">${area}</div><div class="skill-chips">${g.skills.filter(k => k.area === area).map(k =>
            `<button class="skill-chip" data-act="workon" data-skill="${k.id}" aria-pressed="${state.profile.workOns.includes(k.id)}"><b>${esc(k.name)}</b><span>${esc(k.about)}</span></button>`).join("")}</div>`).join("")}
          <p class="hint">Then add a Skills session on any day and pick the skill to practise.</p>` : ""}`,
      !g || !picked.length, "skills-panel");
  }

  /* ---------- session helpers ---------- */
  function sessionsFor(week, day) {
    return state.sessions
      .filter(s => s.week === week && s.day === day)
      .sort((a, b) => {
        const at = a.start || "", bt = b.start || "";
        if (at && bt && at !== bt) return at < bt ? -1 : 1;
        if (at && !bt) return -1;
        if (!at && bt) return 1;
        return (a.order || 0) - (b.order || 0);
      });
  }
  const findSession = id => state.sessions.find(s => s.id === id);

  function doseText(s) {
    const w = weekCfg(s.week);
    if (s.type === "broncos") return `${plural(w.broncos.sets, "set")} of ${w.broncos.reps}`;
    if (s.type === "mas") return `${plural(w.mas.sets, "set")} of ${plural(w.mas.runs, "run")}`;
    if (s.type === "zone2") return `${w.zone2 || 20} min`;
    if (s.type === "gymprog") { const g = gymProgram(); return g ? g.label : ""; }
    return "";
  }
  function timeMeta(s) {
    const bits = [];
    if (s.start) bits.push(fmtTime(s.start));
    if (s.duration) bits.push(`${s.duration} min`);
    return bits.join(" · ");
  }
  function broncosSequence(sets, reps) {
    const seq = [];
    for (let i = 0; i < sets; i++) {
      for (let j = 0; j < reps; j++) {
        seq.push({ k: "run" });
        if (j < reps - 1) seq.push({ k: "rest", sec: CONFIG.broncos.restBetweenRepsSec });
      }
      if (i < sets - 1) seq.push({ k: "rest", sec: CONFIG.broncos.restBetweenSetsSec, long: true });
    }
    return seq;
  }

  /* ---------- rendering: header / tabs ---------- */
  function renderChrome() {
    $("#brand").innerHTML = `${esc(CONFIG.programName)}<small>${esc(CONFIG.programSubtitle)}</small>`;
    document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === state.view)));
    $("#view").setAttribute("aria-labelledby", state.view === "calc" ? "tab-calc" : "tab-week");
    $("#foot").textContent = storageOK ? "Your plan is saved only on this device and browser." : "";
  }
  function render() {
    renderChrome();
    if (state.view === "calc") renderCalc(); else renderWeek();
  }

  /* ---------- My week ---------- */

    const p = state.profile, yc = yearCfg(), g = gymProgram();
    const summary = g ? `${esc(g.label)} · Year ${p.year}` : "Choose your year level";

            <select id="yearSel">
              <option value="">Choose your year…</option>

            ${yc && !yc.gym
              ? `<p class="hint" style="margin:4px 0 0">Year ${yc.year} uses the at-home program. No gym needed.</p>`
              : `<div class="seg" role="group" aria-label="Where I train">
                  <button data-act="access" data-access="gym" aria-pressed="${p.access !== "home"}">Gym (weights)</button>
                  <button data-act="access" data-access="home" aria-pressed="${p.access === "home"}">Home (no gym)</button>

      !p.year);
  }

  function targetPanelHTML() {
    const t = currentTarget();
    const r = calcResult(state.calc);
    let big, sub;
    if (t) {
      big = `Run ${t.m} m in ${CONFIG.mas.effortSec} seconds`;
      sub = `Using: <strong>${esc(t.label)}</strong>`;
      if (t.kind === "lane" && r.status === "ok") sub += ` · your own distance is ${r.rounded} m`;
    } else {
      big = "No running target yet";
      sub = state.calc.mode === "lane"
        ? "Pick your squad lane below."
        : "Enter your Bronco time, or pick the lane your coach gave you.";
    }
    const summary = t ? `Run ${t.m} m in ${CONFIG.mas.effortSec} s · ${esc(t.short)}` : "Not set yet";
    return foldHTML("target", "MAS running target", summary, `
        <div class="target-big" style="margin-top:10px">${big}</div>
        <div class="target-sub">${sub}</div>
        <div class="lane-row">
          <span class="lbl">Squad lane:</span>
          ${CONFIG.lanes.map(l => `<button class="chip" data-act="lane" data-lane="${l.id}" aria-pressed="${state.calc.mode === "lane" && state.calc.lane === l.id}" aria-label="Lane ${l.id}, ${l.m} metres">${l.id} <small>${l.m} m</small></button>`).join("")}
          ${r.status === "ok" ? `<button class="chip" data-act="mode-ind" aria-pressed="${state.calc.mode === "individual"}">Mine <small>${r.rounded} m</small></button>` : ""}
        </div>
        <p class="hint" style="margin:8px 0 0"><button class="linkish" data-act="go-calc">${r.status === "ok" ? "Change my Bronco time" : "Enter my Bronco time"}</button></p>`,
      !t);
  }

  function sessionRowHTML(s) {
    const t = currentTarget();
    const tagLbl = TYPES[s.type] ? TYPES[s.type].label : "Session";
    let title = esc(s.title);
    const lines = [];
    if (s.type === "broncos") {
      title = `${esc(s.title)} · ${doseText(s)}`;
      lines.push(`${repMetres()} m reps · ${fmtDur(CONFIG.broncos.restBetweenRepsSec)} rest between reps${weekCfg(s.week).broncos.sets > 1 ? `, ${fmtDur(CONFIG.broncos.restBetweenSetsSec)} between sets` : ""}`);
    } else if (s.type === "mas") {
      title = `${esc(s.title)} · ${doseText(s)}`;
      if (t) lines.push(`<strong>${t.m} m in ${CONFIG.mas.effortSec} s</strong> · ${esc(t.short)}`);
      else lines.push(`<span class="warnline">Set your target: Bronco time or lane</span>`);
      lines.push(`${fmtDur(CONFIG.mas.recoveryBetweenRunsSec)} recovery between runs · ${fmtDur(CONFIG.mas.restBetweenSetsSec)} between sets`);
    } else if (s.type === "zone2") {
      title = `${esc(s.title)} · ${doseText(s)}`;
      const p = zone2Pace();
      lines.push(`Easy: you can talk in full sentences${p ? ` · about <strong>${p.fast}–${p.slow} per km</strong>` : ""}`);
    } else if (s.type === "gymprog") {
      const g = gymProgram();
      if (g) {
        const day = g.prog["day" + (s.gymDay || 1)];
        const main = exercisesFor(day.strength, s.week).filter(e => /^(A1|B1|B2)$/.test(e.slot)).map(e => e.name);
        title = `${esc(s.title)} · ${esc(g.where)}`;
        lines.push(`${esc(g.label)} · about ${g.prog.minutes || CONFIG.gym.minutes} min`);
        if (main.length) lines.push(esc(main.join(" · ")));
      } else {
        lines.push(`<span class="warnline">Choose your year level to see your program</span>`);
      }
    }
    if (s.skillId) {
      const k = skillById(s.skillId);
      if (k) lines.push(`Focus: <strong>${esc(k.name)}</strong>`);
    }
    const tm = timeMeta(s);
    if (tm) lines.unshift(tm);
    if (s.notes) lines.push(`📝 ${esc(s.notes.length > 70 ? s.notes.slice(0, 70) + "…" : s.notes)}`);
    return `
      <li class="sess${s.done ? " done" : ""}">
        <button class="tick" data-act="tick" data-id="${s.id}" aria-pressed="${!!s.done}" aria-label="${s.done ? "Completed" : "Mark complete"}: ${esc(s.title)}">
          <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
        </button>
        <button class="open" data-act="open" data-id="${s.id}">
          <span class="tag ${s.type}">${esc(tagLbl)}</span>
          <span class="t">${title}</span>
          ${lines.map(l => `<span class="m">${l}</span>`).join("")}
        </button>
      </li>`;
  }

  function renderWeek() {
    document.querySelectorAll("details[data-fold]").forEach(d => { foldState[d.dataset.fold] = d.open; });
    const wk = state.week;
    const wc = weekCfg(wk);
    const nowWeek = programWeekNow();
    const showToday = CONFIG.programStartMonday ? nowWeek === wk : true;
    const tIdx = todayIdx();
    const weekSessions = state.sessions.filter(s => s.week === wk);
    const doneCount = weekSessions.filter(s => s.done).length;

    let html = "";
    html += `<div class="week-head"><h1>Week ${wk} <span class="sr">of ${WEEKS.length}</span></h1>
      <span class="week-note">${wc.note ? esc(wc.note) + " · " : ""}${doneCount}/${weekSessions.length} done</span></div>`;
    html += `<div class="weeks" role="group" aria-label="Choose week">${WEEKS.map(w => {
      const ws = state.sessions.filter(s => s.week === w);
      const all = ws.length && ws.every(s => s.done);
      return `<button data-act="week" data-week="${w}" aria-pressed="${w === wk}" aria-label="Week ${w}${all ? ", all done" : ""}"><span>WK</span>${w}${all ? " ✓" : ""}</button>`;
    }).join("")}</div>`;
    if (nowWeek && nowWeek !== wk) {
      html += `<p style="margin:-4px 0 12px"><button class="btn" data-act="week" data-week="${nowWeek}">Go to this week (Week ${nowWeek})</button></p>`;
    }

    if (showToday) {
      const todays = sessionsFor(wk, tIdx);
      html += `<section class="today-strip" aria-labelledby="todayH"><h2 id="todayH">Today · ${DAYS[tIdx]}</h2>${
        todays.length
          ? `<ul>${todays.map(s => `<li><button data-act="open" data-id="${s.id}">${s.done ? "✓ " : ""}${esc(s.title)}${doseText(s) ? " · " + esc(doseText(s)) : ""}${s.start ? " · " + fmtTime(s.start) : ""}</button></li>`).join("")}</ul>`
          : `<p style="margin:0">Nothing planned. Rest day, or <button class="linkish" data-act="add" data-day="${tIdx}">add a session</button>.</p>`
      }</section>`;
    }

    html += profilePanelHTML();
    html += skillsPanelHTML();
    html += targetPanelHTML();

    html += `<div class="days">`;
    for (let d = 0; d < 7; d++) {
      const list = sessionsFor(wk, d);
      const isToday = showToday && d === tIdx;
      const dn = list.filter(s => s.done).length;
      html += `
        <section class="day${isToday ? " is-today" : ""}" aria-labelledby="dayH${d}">
          <div class="day-head">
            <h3 id="dayH${d}">${DAYS[d]} ${isToday ? `<span class="badge">Today</span>` : ""}</h3>
            ${list.length ? `<span class="day-count">${dn}/${list.length} done</span>` : ""}
          </div>
          ${list.length ? `<ul class="sessions">${list.map(sessionRowHTML).join("")}</ul>` : `<p class="empty-day">No sessions planned.</p>`}
          <button class="add-btn" data-act="add" data-day="${d}" aria-label="Add session on ${DAYS[d]}">+ Add session</button>
        </section>`;
    }
    html += `</div>`;
    $("#view").innerHTML = html;

    const ys = $("#yearSel");
    if (ys) ys.addEventListener("change", () => {
      state.profile.year = ys.value ? Number(ys.value) : null;
      save(); render();
      const g = gymProgram();
      toast(g ? `Gym sessions now use ${g.label}` : "Year level cleared");
      const again = $("#yearSel"); if (again) again.focus();
    });
    const gs = $("#groupSel");
    if (gs) gs.addEventListener("change", () => {
      state.profile.skillGroup = gs.value || null;
      const g = skillGroup();
      state.profile.workOns = g ? state.profile.workOns.filter(id => g.skills.some(k => k.id === id)) : [];
      save(); render();
      const again = $("#groupSel"); if (again) again.focus();
    });
  }

  /* ---------- Calculator ---------- */
  function renderCalc() {

    $("#view").innerHTML = `
      <section class="panel">
        <h1>Bronco calculator</h1>
        <p>Find your running distance for the Straight-line MAS sessions.</p>
        <p class="hint" style="margin:0">The 1.2 km Bronco test is <strong>five continuous rounds</strong> of 20 m, 40 m and 60 m out and back, all from the same line. The timed test has <strong>no rest breaks</strong>. Enter your full test time, not your Broken Broncos training reps.</p>

            <label><input type="radio" name="wt" value="over100" ${c.weight === "over100" ? "checked" : ""}> 100 kg or over</label>
          </div>
          <p class="hint">Bigger bodies lose more time on the turns, so the estimate adjusts for it. You don’t need your exact weight.</p>
        </fieldset>

        <div id="calcOut" aria-live="polite"></div>
      </section>

      <section class="panel" id="modePanel"></section>

      <section class="panel">
        <details>
          <summary>How this is worked out</summary>
          <div class="formula">
            <ol>
              <li>Total seconds = minutes × 60 + seconds.</li>
              <li>Turn adjustment: ${CONFIG.calculator.turnAdjustSec.under100} s (under 100 kg) or ${CONFIG.calculator.turnAdjustSec.over100} s (100 kg or over).</li>
              <li>Estimated MAS (m/s) = ${CONFIG.calculator.testDistanceM} ÷ (total seconds − turn adjustment).</li>
              <li>Cone distance = MAS × ${CONFIG.mas.intensity.toFixed(2)} × ${CONFIG.mas.effortSec} s (${Math.round(CONFIG.mas.intensity * 100)}% of MAS), rounded to the nearest metre.</li>
              <li>Nearest squad lane: ${CONFIG.lanes.map(l => `${l.id} ${l.m} m`).join(", ")}. A tie goes to the shorter lane.</li>

            </ol>
          </div>
        </details>
      </section>`;
    updateCalcOutput();

    const onInput = () => {
      state.calc.min = $("#bMin").value;
      state.calc.sec = $("#bSec").value;
      updateCalcOutput();
      save();
    };
    $("#bMin").addEventListener("input", onInput);
    $("#bSec").addEventListener("input", onInput);
    document.querySelectorAll('input[name="wt"]').forEach(r => r.addEventListener("change", () => {
      state.calc.weight = r.value;
      updateCalcOutput();
      save();
    }));
  }

  function updateCalcOutput() {
    const r = calcResult(state.calc);
    const minEl = $("#bMin"), secEl = $("#bSec");
    if (minEl) minEl.setAttribute("aria-invalid", String(r.status === "error" && r.errs.min));
    if (secEl) secEl.setAttribute("aria-invalid", String(r.status === "error" && r.errs.sec));
    $("#calcErr").innerHTML = r.status === "error" ? `<div class="error" role="alert">${esc(r.errs.msg)}</div>` : "";
    if (r.status === "ok") {
      $("#calcOut").innerHTML = `
        <div class="result">
          <div class="headline">Run ${r.rounded} m in ${CONFIG.mas.effortSec} seconds.</div>
          <dl>
            <dt>Estimated MAS</dt><dd>${r.mas.toFixed(2)} m/s</dd>
            <dt>Closest squad lane</dt><dd>Lane ${r.nearest.id} (${r.nearest.m} m)</dd>
          </dl>
        </div>`;
    } else if (r.status === "empty") {
      $("#calcOut").innerHTML = `<div class="placeholder">Your target will show here once both minutes and seconds are filled in.</div>`;
    } else {
      $("#calcOut").innerHTML = ""; // invalid input: clear any stale result
    }
    renderModePanel(r);
  }

      </div>
      <p class="hint" style="margin-top:12px"><strong>Now on your MAS cards:</strong> ${t ? `${t.m} m in ${CONFIG.mas.effortSec} s — ${esc(t.label)}` : (c.mode === "lane" ? "pick a lane above." : "enter a valid Bronco time above, or pick a lane.")}</p>

  /* ---------- Sheet (dialog) ---------- */
  const sheet = $("#sheet");

    sheet.innerHTML = html;

      if (typeof sheet.showModal === "function") sheet.showModal(); else sheet.setAttribute("open", "");
    }
    const first = sheet.querySelector("[autofocus]") || sheet.querySelector(".close-x");
    if (first) first.focus();
  }
  function closeSheet() {
    if (typeof sheet.close === "function" && sheet.open) sheet.close(); else sheet.removeAttribute("open");

  sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); }); // tap backdrop
  sheet.addEventListener("cancel", e => { e.preventDefault(); closeSheet(); });

  function sheetHead(title, sub) {
    return `<div class="sheet-head"><div><h2 id="sheetTitle">${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ""}</div>

  function gymDetailHTML(s) {
    const g = gymProgram();
    if (!g) {
      return `<section><div class="callout pink"><strong>Choose your year level first.</strong> Your gym program depends on your year.</div>
        <div class="field" style="margin-top:12px"><label for="yearSel2">My year level</label>
        <select id="yearSel2" data-reopen="${s.id}"><option value="">Choose your year…</option>
        ${CONFIG.yearLevels.map(y => `<option value="${y.year}">Year ${y.year}</option>`).join("")}</select></div></section>`;
    }
    const day = g.prog["day" + (s.gymDay || 1)];
    const w = weekCfg(s.week);
    const power = exercisesFor(day.power, s.week);
    const strength = exercisesFor(day.strength, s.week);
    const groups = ["A", "B", "C"].map(L => ({ L, items: strength.filter(e => e.slot[0] === L) })).filter(x => x.items.length);
    const anyTempo = strength.some(e => /^\d{3}$/.test(String(e.tempo)));
    let html = `<section><div class="facts">
        <div class="fact"><span>Program</span><b>${esc(g.label)}</b></div>
        <div class="fact"><span>Time</span><b>About ${g.prog.minutes || CONFIG.gym.minutes} min</b></div>

      </div></section>`;
    html += `<section><h3>Warm-up · do every session</h3>
      <ul class="ex-list">${CONFIG.gym.warmup.map(([n, d, c]) => `<li><span class="slot">•</span><span class="nm">${esc(n)}</span><span class="dose">${esc(d)}</span><span class="sub2">${esc(c)}</span></li>`).join("")}</ul></section>`;
    if (power.length) html += `<section><h3>Power &amp; speed</h3><p class="hint" style="margin-top:0">Fresh and fast. Full rest between sets.</p>${exListHTML(power, "power")}</section>`;
    html += `<section><h3>Strength</h3>
      <p class="hint" style="margin-top:0">Do each group as a circuit: one set of each exercise back-to-back, rest 60–90 seconds, then repeat until all sets are done.${anyTempo ? " Tempo 3-2-1 means 3 seconds lowering, 2 seconds pause, 1 second up." : ""} “Each side” means both legs or arms.</p>
      ${groups.map(gr => `<div class="group-h">Group ${gr.L} <small>(${gr.items.map(e => e.slot).join(", ")})</small></div>${exListHTML(gr.items, "strength")}`).join("")}
    </section>`;
    html += `<section><div class="callout">${esc(g.prog.rule || CONFIG.gym.rule)} Stop if something hurts sharply or in a joint. Normal muscle soreness is OK.</div></section>`;
    return html;
  }

  function zone2DetailHTML(s) {
    const w = weekCfg(s.week);
    const p = zone2Pace();
    return `<section><div class="facts">
        <div class="fact"><span>This week</span><b>${w.zone2 || 20} minutes</b></div>
        <div class="fact"><span>Effort</span><b>Easy · 3–4 out of 10</b></div>
        <div class="fact wide"><span>Pace guide</span><b>${p ? `About ${p.fast}–${p.slow} per km` : "Set your Bronco time or lane to see a pace"}</b></div>
      </div></section>
      <section><h3>Why</h3><p>Easy running builds your aerobic base, so you recover faster between hard efforts and handle the Broncos and MAS sessions better. It is meant to feel easy. Don’t turn it into a third hard session.</p></section>
      <section><h3>How easy is easy?</h3><ul>
        <li><strong>Talk test:</strong> you can talk in full sentences, just.</li>
        <li><strong>Effort:</strong> 3–4 out of 10. You feel like you could keep going for ages.</li>
        <li>If you can only get out a few words, slow down or walk for a bit.</li></ul></section>
      <section><h3>Swap it if you need to</h3><ul>
        <li>Bike, swim or pool session at the same easy effort for the same time.</li>
        <li>Swap if you have sore knees, heels or shins, you’ve had a recent growth spurt, or you’re carrying an injury.</li>
        <li>Run on grass or trails where you can.</li>
        <li>Got club or team training this week? You can skip this one.</li></ul></section>
      <section><div class="callout pink">Eat enough to fuel your training, especially in the holidays. Feeling flat all the time, getting sick a lot, or missing periods? Tell your coach or a parent.</div></section>`;
  }

  function openDetail(id) {
    const s = findSession(id);
    if (!s) return;
    const w = weekCfg(s.week);
    let body = "";

    if (s.type === "broncos") {
      const { sets, reps } = w.broncos;
      const seq = broncosSequence(sets, reps);
      const total = sets * reps * repMetres();
      const legs = CONFIG.broncos.legsM;
      body += `<section><div class="facts">
          <div class="fact"><span>This week</span><b>${plural(sets, "set")} of ${reps}</b></div>
          <div class="fact"><span>Total</span><b>${total} m</b></div>
          <div class="fact"><span>Each rep</span><b>${repMetres()} m · under ${fmtDur(CONFIG.broncos.repTargetSec)}</b></div>
          <div class="fact"><span>Rest</span><b>${fmtDur(CONFIG.broncos.restBetweenRepsSec)} reps${sets > 1 ? ` · ${fmtDur(CONFIG.broncos.restBetweenSetsSec)} sets` : ""}</b></div>
        </div></section>`;
      body += warmupHTML("broncos");
      body += `<section><h3>One rep</h3>
        <p>From the same line: ${legs.map(m => `${m} m out and back`).join(", then ")} (${repMetres()} m). Aim to finish each rep within ${fmtDurLong(CONFIG.broncos.repTargetSec)}.</p>
        <p>Rest ${fmtDurLong(CONFIG.broncos.restBetweenRepsSec)} between reps${sets > 1 ? ` and ${fmtDurLong(CONFIG.broncos.restBetweenSetsSec)} between sets. At the set break, take the ${fmtDurLong(CONFIG.broncos.restBetweenSetsSec)} on its own (not added to the rep rest)` : ""}.</p></section>`;
      body += `<section><h3>Your sequence</h3><ol class="seq" aria-label="Session sequence">${seq.map(x => x.k === "run"
        ? `<li class="run">Run ${repMetres()} m</li>`
        : `<li class="rest${x.long ? " long" : ""}">${fmtDur(x.sec)} rest</li>`).join("")}</ol>
        <p class="hint">This is a training workout, not the timed 1.2 km Bronco test.</p></section>`;
    } else if (s.type === "mas") {
      const t = currentTarget();
      const r = calcResult(state.calc);
      const { sets, runs } = w.mas;
      body += `<section><div class="fact wide" style="background:${t ? "var(--accent-soft)" : "var(--warn-soft)"};border:2px solid ${t ? "var(--pink-dk)" : "#f3b989"}">
          <span>Your cone distance</span>
          <b style="font-size:26px">${t ? `Run ${t.m} m in ${CONFIG.mas.effortSec} seconds` : "Not set yet"}</b>
          <div style="font-weight:700;margin-top:4px">${t ? `Using: ${esc(t.label)}` : "Enter your Bronco time or pick your lane below."}</div>
        </div>
        <div class="lane-row">
          ${r.status === "ok" ? `<button class="chip" data-act="mode-ind" data-reopen="${s.id}" aria-pressed="${state.calc.mode === "individual"}">My distance <small>${r.rounded} m</small></button>` : ""}
          ${CONFIG.lanes.map(l => `<button class="chip" data-act="lane" data-lane="${l.id}" data-reopen="${s.id}" aria-pressed="${state.calc.mode === "lane" && state.calc.lane === l.id}" aria-label="Lane ${l.id}, ${l.m} metres">${l.id} <small>${l.m} m</small></button>`).join("")}
        </div></section>`;
      body += `<section><div class="facts">
          <div class="fact"><span>This week</span><b>${plural(sets, "set")} of ${plural(runs, "run")}</b></div>
          <div class="fact"><span>Run time</span><b>${CONFIG.mas.effortSec} s each</b></div>
          <div class="fact"><span>Between runs</span><b>${fmtDur(CONFIG.mas.recoveryBetweenRunsSec)} recovery</b></div>
          <div class="fact"><span>Between sets</span><b>${fmtDur(CONFIG.mas.restBetweenSetsSec)} rest</b></div>
        </div></section>`;
      body += warmupHTML("mas");
      body += `<section><h3>Set up</h3><ul>
          <li>Start line and target cone <strong>${t ? t.m + " m" : "your distance"}</strong> apart.</li>
          <li>A recovery cone ${CONFIG.mas.recoveryConeM} m beyond each end.</li></ul></section>
        <section><h3>How to run it</h3><ol>
          <li>Run to the target cone in ${CONFIG.mas.effortSec} seconds (${Math.round(CONFIG.mas.intensity * 100)}% of your estimated MAS).</li>
          <li>Jog forward ${CONFIG.mas.recoveryConeM} m to the recovery cone and back to the finish line, ready to run the opposite direction.</li>
          <li>Go again when the ${fmtDur(CONFIG.mas.recoveryBetweenRunsSec)} recovery is up. Each ${CONFIG.mas.effortSec}-second effort counts as one run.</li>
          <li>After ${plural(runs, "run")}, rest ${fmtDurLong(CONFIG.mas.restBetweenSetsSec)}, then do the next set.</li></ol></section>`;
    } else if (s.type === "gymprog") {
      body += gymDetailHTML(s);
    } else if (s.type === "zone2") {
      body += zone2DetailHTML(s);
    }

    if (s.skillId) {
      const k = skillById(s.skillId);
      if (k) body += `<section><h3>Skill focus · ${esc(k.area)}</h3><p><strong>${esc(k.name)}</strong>: ${esc(k.about)}</p>
        <h3>What good looks like</h3><ul>${k.lookFors.map(l => `<li>${esc(l)}</li>`).join("")}</ul></section>`;
    }
    const tm = timeMeta(s);
    if (tm) body = `<section><h3>When</h3><p>${esc(tm)}</p></section>` + body;
    if (s.notes) body += `<section><h3>My notes</h3><div class="notes-box">${esc(s.notes)}</div></section>`;
    else if (!PRESET.includes(s.type)) body += `<section><p class="hint">No notes yet. Tap Edit to add some.</p></section>`;

    body += `<section>
        <button class="btn ${s.done ? "" : "good"}" data-act="tick" data-id="${s.id}" data-reopen="${s.id}" style="width:100%;margin-bottom:10px" aria-pressed="${!!s.done}">${s.done ? "✓ Completed, tap to undo" : "Mark complete"}</button>
        <div class="field"><label for="moveSel">Move to another day (Week ${s.week})</label>
          <select id="moveSel" data-id="${s.id}">${DAYS.map((d, i) => `<option value="${i}" ${i === s.day ? "selected" : ""}>${d}${i === s.day ? " (current)" : ""}</option>`).join("")}</select></div>
        <div class="btn-row">
          <button class="btn" data-act="edit" data-id="${s.id}">Edit</button>
          <button class="btn danger" data-act="remove" data-id="${s.id}">Remove</button>
        </div></section>`;

    const sub = `Week ${s.week} · ${DAYS[s.day]}${doseText(s) ? " · " + doseText(s) : ""}`;
    openSheet(sheetHead(esc(s.title), esc(sub)) + `<div class="sheet-body">${body}</div>`);
    $("#moveSel").addEventListener("change", e => {
      const to = Number(e.target.value);
      const ss = findSession(e.target.dataset.id);
      if (!ss || ss.day === to) return;
      ss.day = to;
      save();
      render();
      toast(`Moved to ${DAYS[to]}`);
      openDetail(ss.id);
    });
    const ys2 = $("#yearSel2");
    if (ys2) ys2.addEventListener("change", () => {
      if (!ys2.value) return;
      state.profile.year = Number(ys2.value);
      save(); render(); openDetail(ys2.dataset.reopen);
    });
  }

  /* Add / edit form */
  function openForm(opts) {
    const editing = opts.id ? findSession(opts.id) : null;
    const isPreset = editing && PRESET.includes(editing.type);
    let type = editing ? editing.type : "gym";
    const day = editing ? editing.day : opts.day;
    const wk = editing ? editing.week : state.week;
    const v = editing || { title: "", start: "", duration: "", notes: "" };
    const remaining = WEEKS.filter(w => w >= wk);

    const html = sheetHead(editing ? "Edit session" : "Add session", `Week ${wk}`) + `
      <form class="sheet-body" id="sessForm" novalidate>
        ${isPreset ? "" : `<div class="field"><span class="lbl" id="typeLbl">Type</span>
          <div class="type-grid" role="group" aria-labelledby="typeLbl">
            ${ADDABLE.map(k => `<button type="button" data-type="${k}" aria-pressed="${k === type}">${TYPES[k].label}</button>`).join("")}
          </div></div>`}
        <div id="skillPick"></div>
        <div class="field"><label for="fTitle">Title</label>
          <input id="fTitle" type="text" maxlength="80" value="${esc(v.title)}" placeholder="e.g. Passing both sides" ${editing ? "" : "autofocus"} required>
          <div id="titleErr"></div></div>
        <div class="field"><label for="fDay">Day</label>
          <select id="fDay">${DAYS.map((d, i) => `<option value="${i}" ${i === day ? "selected" : ""}>${d}</option>`).join("")}</select></div>
        <div class="two">
          <div class="field"><label for="fStart">Start time <span class="opt">(optional)</span></label>
            <input id="fStart" type="time" value="${esc(v.start)}"></div>
          <div class="field"><label for="fDur">Minutes <span class="opt">(optional)</span></label>
            <input id="fDur" type="number" inputmode="numeric" min="1" max="600" step="1" value="${esc(v.duration)}"></div>
        </div>
        <div id="durErr"></div>
        <div class="field"><label for="fNotes">Notes <span class="opt">(optional)</span></label>
          <textarea id="fNotes" maxlength="1000" placeholder="e.g. Skill I’m working on, weights I lifted, how it felt">${esc(v.notes)}</textarea></div>
        ${editing ? `<p class="hint">Changes apply to this session only (Week ${wk}).</p>` : `
        <div class="field"><label class="check-row"><input type="checkbox" id="fRepeat" ${remaining.length < 2 ? "disabled" : ""}>
          <span><b>Repeat in remaining weeks</b><span>${remaining.length < 2 ? "This is the last week." : `Adds this session on the same day in Weeks ${wk}–${LAST_WEEK}. Each copy can be edited on its own later.`}</span></span></label></div>`}
        <div class="btn-row">
          <button type="button" class="btn" data-act="close">Cancel</button>
          <button type="submit" class="btn primary">${editing ? "Save changes" : "Add session"}</button>
        </div>
      </form>`;
    openSheet(html);

    let skillId = editing ? (editing.skillId || "") : "";
    let autoTitle = "", autoNotes = "";
    function renderSkillPick() {
      const box = $("#skillPick");
      if (!box) return;
      if (type !== "skills") { box.innerHTML = ""; return; }
      const g = skillGroup();
      if (!g) { box.innerHTML = `<div class="field"><div class="callout pink">Choose your position under <strong>My skills to work on</strong> to pick a skill from your feedback report.</div></div>`; return; }
      const mine = workOnSkills(), rest = g.skills.filter(k => !mine.includes(k));
      const chip = k => `<button type="button" class="skill-chip" data-skillpick="${k.id}" aria-pressed="${k.id === skillId}"><b>${esc(k.name)}</b><span>${esc(k.area)}</span></button>`;
      box.innerHTML = `<div class="field"><span class="lbl" id="skLbl">Skill to practise <span class="opt">(optional)</span></span>
        <div role="group" aria-labelledby="skLbl">
        ${mine.length ? `<p class="hint" style="margin:0 0 6px">My work-ons</p><div class="skill-chips">${mine.map(chip).join("")}</div>` : ""}
        ${rest.length ? `<p class="hint" style="margin:8px 0 6px">${mine.length ? "Other skills" : "Skills from your report"}</p><div class="skill-chips">${rest.map(chip).join("")}</div>` : ""}
        </div></div>`;
      box.querySelectorAll("[data-skillpick]").forEach(b => b.addEventListener("click", () => {
        const k = g.skills.find(x => x.id === b.dataset.skillpick);
        skillId = skillId === k.id ? "" : k.id;
        const ti = $("#fTitle"), no = $("#fNotes");
        if (skillId) {
          if (!ti.value.trim() || ti.value === autoTitle) { ti.value = autoTitle = k.name; }
          if (!no.value.trim() || no.value === autoNotes) { no.value = autoNotes = lookForsText(k); }
        }
        renderSkillPick();
      }));
    }
    renderSkillPick();

    sheet.querySelectorAll(".type-grid button").forEach(b => b.addEventListener("click", () => {
      type = b.dataset.type;
      sheet.querySelectorAll(".type-grid button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      const ti = $("#fTitle");
      if (!ti.value.trim()) ti.placeholder = type === "custom" ? "Session name" : `e.g. ${TYPES[type].label}`;
      renderSkillPick();
    }));

    $("#sessForm").addEventListener("submit", e => {
      e.preventDefault();
      const title = $("#fTitle").value.trim();
      const durRaw = $("#fDur").value.trim();
      let bad = false;
      $("#titleErr").innerHTML = ""; $("#durErr").innerHTML = "";
      $("#fTitle").setAttribute("aria-invalid", "false"); $("#fDur").setAttribute("aria-invalid", "false");
      if (!title) { $("#titleErr").innerHTML = `<div class="error" role="alert">Give the session a title.</div>`; $("#fTitle").setAttribute("aria-invalid", "true"); bad = true; }
      if (durRaw && !(/^\d+$/.test(durRaw) && +durRaw >= 1 && +durRaw <= 600)) { $("#durErr").innerHTML = `<div class="error" role="alert">Minutes must be a whole number from 1 to 600.</div>`; $("#fDur").setAttribute("aria-invalid", "true"); bad = true; }
      if (bad) { (title ? $("#fDur") : $("#fTitle")).focus(); return; }
      const data = {
        title, day: Number($("#fDay").value), start: $("#fStart").value || "",
        duration: durRaw ? Number(durRaw) : "", notes: $("#fNotes").value.trim(),
        skillId: type === "skills" ? skillId : ""
      };
      if (!isPreset) data.type = type;
      if (editing) {
        Object.assign(editing, data);
        save(); closeSheet(); render(); toast("Session updated");
      } else {
        const repeat = $("#fRepeat") && $("#fRepeat").checked;
        const weeks = repeat ? remaining : [wk];
        weeks.forEach(w => state.sessions.push(Object.assign({ id: uid(), week: w, done: false, order: state.nextOrder++ }, data, { type })));
        save(); closeSheet(); render();
        toast(repeat ? `Added to ${DAYS[data.day]} in Weeks ${wk}–${LAST_WEEK}` : `Added to ${DAYS[data.day]}`);
      }
    });
  }

  /* ---------- events ---------- */
  document.addEventListener("click", e => {
    const tab = e.target.closest("nav.tabs button");
    if (tab) { state.view = tab.dataset.view; save(); render(); window.scrollTo(0, 0); return; }
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    const reopen = el.dataset.reopen;
    switch (act) {
      case "week":
        state.week = Number(el.dataset.week); save(); render(); break;
      case "open":
        openDetail(el.dataset.id); break;
      case "tick": {
        const s = findSession(el.dataset.id);
        if (!s) break;
        s.done = !s.done; save(); render();
        toast(s.done ? "Nice work, marked complete" : "Marked not done");
        if (reopen) openDetail(reopen);
        break;
      }
      case "add":
        openForm({ day: Number(el.dataset.day) }); break;
      case "edit":
        openForm({ id: el.dataset.id }); break;
      case "remove": {
        const s = findSession(el.dataset.id);
        if (!s) break;
        if (!window.confirm(`Remove “${s.title}” from ${DAYS[s.day]}, Week ${s.week}?`)) break;
        state.sessions = state.sessions.filter(x => x.id !== s.id);
        save(); closeSheet(); render(); toast("Session removed");
        break;
      }
      case "close":
        closeSheet(); break;
      case "workon": {
        const id = el.dataset.skill, list = state.profile.workOns;
        state.profile.workOns = list.includes(id) ? list.filter(x => x !== id) : list.concat(id);
        save(); render();
        const again = document.querySelector(`[data-act="workon"][data-skill="${id}"]`); if (again) again.focus();
        break;
      }
      case "access":
        state.profile.access = el.dataset.access; save(); render();
        { const g = gymProgram(); if (g) toast(`Gym sessions now use ${g.label}`); }
        break;
      case "lane":
        state.calc.lane = el.dataset.lane; state.calc.mode = "lane"; save();
        render(); if (reopen) openDetail(reopen);
        toast(`Using squad lane ${el.dataset.lane}`);
        break;
      case "mode-ind": {
        const r = calcResult(state.calc);
        if (r.status !== "ok") { toast("Enter a valid Bronco time first"); break; }
        state.calc.mode = "individual"; save();
        if (state.view === "calc") updateCalcOutput(); else render();
        if (reopen) openDetail(reopen);
        toast(`Using my distance: ${r.rounded} m`);
        break;
      }
      case "mode-lane": {
        const r = calcResult(state.calc);
        if (!laneById(state.calc.lane)) {
          if (r.status === "ok") state.calc.lane = r.nearest.id;
          else { toast("Pick a lane below"); state.calc.mode = "lane"; save(); updateCalcOutput(); break; }
        }
        state.calc.mode = "lane"; save(); updateCalcOutput();
        toast(`Using squad lane ${state.calc.lane}`);
        break;
      }
      case "go-calc":
        state.view = "calc"; save(); render(); window.scrollTo(0, 0); break;
      case "go-week":
        state.view = "week"; save(); render(); window.scrollTo(0, 0); break;
    }
  });

  /* ---------- start ---------- */
  renderStorageBanner();
  render();
  // First use stores the seeded plan once; later visits re-save the loaded plan.
  // The "Saved on this device" label only appears if this write succeeds.
  save();
})();
</script>
</body>
</html>
